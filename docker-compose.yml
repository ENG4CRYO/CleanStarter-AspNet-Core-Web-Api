services:
  api:
    build: .
    container_name: cleanstarter-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - EnableScalar=true
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=CleanStarterDb;Username=postgres;Password=yourdbpassword
    depends_on:
      - db
    networks:
      - clean-network

  db:
    image: postgres:16-alpine
    container_name: cleanstarter-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourdbpassword
      - POSTGRES_DB=CleanStarterDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    networks:
      - clean-network

volumes:
  postgres_data:

networks:
  clean-network: